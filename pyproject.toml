[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dpsoga-cloud-load-balancer"
version = "0.1.0"
description = "Independent DPSO-GA cloud scheduling and CNN-LSTM reproduction"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "PyYAML", "matplotlib", "torch", "fastapi", "uvicorn[standard]", "httpx", "python-multipart"]
[tool.pytest.ini_options]
pythonpath = ["."]
